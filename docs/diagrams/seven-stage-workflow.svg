  <rect class="card" x="536" y="132" width="148" height="350" rx="16"/>
  <circle cx="610" cy="168" r="18" fill="#dff8f5"/><text x="610" y="174" class="number">04</text>
  <text x="610" y="217" class="name">Graph</text><text x="610" y="251" class="label">任务规划</text>
  <text x="610" y="301" class="detail">任务与依赖</text><text x="610" y="331" class="detail">检查与授权范围</text>
