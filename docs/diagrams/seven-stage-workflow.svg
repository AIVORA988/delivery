  <rect x="1032" y="240" width="136" height="52" rx="12" fill="#fff" stroke="#c5b5ed"/>
  <text x="1100" y="262" class="node">Verify</text><text x="1100" y="283" style="font-size:17px;fill:#6855c3">验证</text>
  <path class="cycle" d="M972 266H1026"/><path class="cycle" d="M1138 292V340"/>
  <text x="1155" y="321" style="font-size:14px;fill:#7960ca">FAIL</text>
  <rect x="1032" y="346" width="136" height="52" rx="12" fill="#eae1fc" stroke="#b39cde"/>
  <text x="1100" y="368" class="node">Repair</text><text x="1100" y="389" style="font-size:16px;fill:#6855c3">归因 · 授权内修复</text>
  <rect x="836" y="346" width="136" height="52" rx="12" fill="#fff" stroke="#c5b5ed"/>
  <text x="904" y="368" class="node">Reverify</text><text x="904" y="389" style="font-size:17px;fill:#6855c3">重验</text>
  <path class="cycle" d="M1032 372H978"/><path class="cycle" d="M904 346V317H1066V298"/>
  <path d="M1168 266H1178V440H1170" fill="none" stroke="#159e94" stroke-width="2" marker-end="url(#pass-arrow)"/>
  <text x="1148" y="419" style="font-size:13px;font-weight:700;fill:#118b82">PASS</text>
  <rect x="836" y="424" width="332" height="35" rx="12" fill="#dff5ef"/>
  <text x="1002" y="448" style="font-size:18px;font-weight:700;fill:#118b82">有效 PASS + 授权 → DONE</text>
  <text x="1000" y="475" style="font-size:15px;fill:#6855c3">当前任务完成后，推进下一就绪任务</text>

  <rect class="card" x="1208" y="132" width="170" height="350" rx="16"/>
  <circle cx="1293" cy="168" r="18" fill="#dff8f5"/><text x="1293" y="174" class="number">06</text>
  <text x="1293" y="217" class="name" style="font-size:23px">Acceptance</text><text x="1293" y="251" class="label">整体验收与交付</text>
  <text x="1293" y="301" class="detail">完整链路与回归</text><text x="1293" y="331" class="detail">接收关联当前版本</text>
  <rect x="1220" y="405" width="146" height="43" rx="12" fill="#edf8fb"/><text x="1293" y="433" class="output">验收与交付结论</text>

