  <path d="m736 246 9 9 16-18" fill="none" stroke="#a46d0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="748" y="283" style="font-size:18px;font-weight:700;fill:#875c15">人工审批</text>
