  <text x="274" y="217" class="name">Explore</text><text x="274" y="251" class="label">现状调查</text>
  <text x="274" y="301" class="detail">源码与依赖</text><text x="274" y="331" class="detail">知识检索与复用</text>
  <rect x="212" y="405" width="124" height="43" rx="12" fill="#edf8fb"/><text x="274" y="433" class="output">现状与差异</text>

