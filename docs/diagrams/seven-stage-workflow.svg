  <circle cx="1483" cy="168" r="18" fill="#dff8f5"/><text x="1483" y="174" class="number">07</text>
  <text x="1483" y="217" class="name" style="font-size:23px">Knowledge</text><text x="1483" y="251" class="label">文档与知识沉淀</text>
  <text x="1483" y="301" class="detail">更新正文与索引</text><text x="1483" y="331" class="detail">下次需求按需复用</text>
  <rect x="1410" y="405" width="146" height="43" rx="12" fill="#edf8fb"/><text x="1483" y="433" class="output">知识与恢复入口</text>

