  <circle cx="847" cy="166" r="18" fill="#e2d8fb"/><text x="847" y="172" class="number" style="fill:#6855c3">05</text>
  <text x="1000" y="174" class="name" style="fill:#6855c3;font-size:30px">Loop</text><text x="1000" y="207" class="label">执行与验证闭环</text>
  <rect x="836" y="240" width="136" height="52" rx="12" fill="#fff" stroke="#c5b5ed"/>
