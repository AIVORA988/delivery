  <rect x="32" y="570" width="1536" height="172" rx="18" fill="#e3f1fb" stroke="#a7cde6" stroke-width="1.5"/>
  <path d="M50 570H1550Q1568 570 1568 588V627H32V588Q32 570 50 570Z" fill="url(#header)"/>
  <text x="56" y="608" style="text-anchor:start;font-size:28px;font-weight:700;fill:#f1f8ff">Harness · 横向支撑能力</text>
  <text x="1544" y="606" style="text-anchor:end;font-size:18px;fill:#c7e1ec">Agent 执行 · Skill 定义规则 · Guard 只读校验</text>
  <rect class="card" x="50" y="639" width="240" height="87" rx="12"/><text x="170" y="672" class="capability">规则与流程</text><text x="170" y="704" class="detail">项目约束 · 共享规范</text>
  <rect class="card" x="302" y="639" width="240" height="87" rx="12"/><text x="422" y="672" class="capability">工具与环境</text><text x="422" y="704" class="detail">文件 · 命令 · 构建与测试</text>
