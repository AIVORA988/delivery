  <rect class="card" x="806" y="639" width="240" height="87" rx="12"/><text x="926" y="672" class="capability">质量门禁</text><text x="926" y="704" class="detail">约定构建 · 测试与回归</text>
  <rect class="card" x="1058" y="639" width="240" height="87" rx="12"/><text x="1178" y="672" class="capability">证据管理</text><text x="1178" y="704" class="detail">基线 · 产物与报告版本</text>
  <rect class="card" x="1310" y="639" width="240" height="87" rx="12"/><text x="1430" y="672" class="capability">恢复与适配</text><text x="1430" y="704" class="detail">累计用量 · 中断恢复</text>
  <text x="800" y="778" style="font-size:18px;fill:#527b98">任务 / 模块完成 ≠ 整体交付 · 缺条件、需决策或到限时记录并停止推进 · 知识随实施持续更新</text>
</svg>
