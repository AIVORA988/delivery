<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">delivery · 七阶段、Task Loop 与 Harness / Seven stages, Task Loop and Harness</title>
  <desc id="desc">Mission: requirements; Explore: investigation; Contract: design finalization; Graph: task planning; Loop: implement, verify, classify failures, repair and reverify within authorization; Acceptance: overall acceptance and delivery; Knowledge: documentation and reuse. The independent human Approval Gate sits between Graph and Loop. A task needs valid PASS evidence and authorization before DONE. Harness supports all seven stages through rules, tools, host permissions, quality checks, evidence and recovery; it is not an additional stage or an execution engine. Agents execute, Skills define rules, and Guard validates records without running application tests or intercepting commands.</desc>
  <defs>
    <linearGradient id="header"><stop stop-color="#0b1f35"/><stop offset="1" stop-color="#145969"/></linearGradient>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f3f8ff"/><stop offset="1" stop-color="#e8f4f7"/></linearGradient>
    <linearGradient id="loop" x2="0" y2="1"><stop stop-color="#f0eaff"/><stop offset="1" stop-color="#faf8ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b8d5ee" stroke-opacity=".2"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m1 1 5 2.5L1 6" fill="none" stroke="#4985be" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="loop-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m1 1 5 2.5L1 6" fill="none" stroke="#7960ca" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="pass-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m1 1 5 2.5L1 6" fill="none" stroke="#159e94" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; text-anchor: middle; fill: #153d5c; }
      .card { fill: #fff; stroke: #b2d7ee; stroke-width: 1.5; }
      .number { font-size: 17px; font-weight: 700; fill: #0c8791; }
      .name { font-size: 24px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 600; }
      .detail { font-size: 18px; fill: #61829f; }
      .output { font-size: 18px; font-weight: 600; fill: #0e768e; }
      .edge { fill: none; stroke: #4985be; stroke-width: 2.5; marker-end: url(#arrow); }
      .cycle { fill: none; stroke: #7960ca; stroke-width: 2.5; marker-end: url(#loop-arrow); stroke-linejoin: round; }
      .node { font-size: 18px; font-weight: 700; fill: #6855c3; }
      .support { fill: none; stroke: #9bbfda; stroke-width: 2; }
      .capability { font-size: 22px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1600" height="800" rx="18" fill="url(#paper)"/>
  <rect width="1600" height="800" rx="18" fill="url(#grid)"/>
  <path d="M18 0H1582Q1600 0 1600 18V105H0V18Q0 0 18 0Z" fill="url(#header)"/>
  <rect x="32" y="26" width="7" height="53" rx="3.5" fill="#42d4c8"/>
  <text x="58" y="55" style="text-anchor:start;font-size:32px;font-weight:700;fill:#f1f8ff">研发交付七阶段</text>
  <text x="58" y="83" style="text-anchor:start;font-size:19px;fill:#b8d2e1">需求与方案前置 · 独立人工审批 · 授权范围内迭代 · 基于证据验收</text>
  <text x="1548" y="62" style="text-anchor:end;font-size:22px;font-weight:700;fill:#7ff0df">delivery / V1.0</text>

  <path class="edge" d="M180 310H196"/><path class="edge" d="M348 310H364"/><path class="edge" d="M516 310H532"/>
  <path class="edge" d="M684 310H700"/><path class="edge" d="M792 310H808"/><path class="edge" d="M1188 310H1204"/><path class="edge" d="M1378 310H1394"/>

